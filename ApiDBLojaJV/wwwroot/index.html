<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Loja de Produtos</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>🛒 Loja de Produtos</h1>
        <p>Sistema de controle de estoque</p>
    </header>

    <main>

        <section class="formulario">

            <h2>Cadastro de Produto</h2>

            <input type="hidden"
                   id="idProduto">

            <div class="campo">

                <label>Nome</label>

                <input type="text"
                       id="nome"
                       placeholder="Digite o nome do produto">

            </div>

            <div class="campo">

                <label>Valor</label>

                <input type="number"
                       step="0.01"
                       id="valor"
                       placeholder="0,00">

            </div>

            <div class="campo">

                <label>Unidade</label>

                <select id="unidade">

                    <option value="">
                        Selecione
                    </option>

                    <option value="UN">
                        Unidade
                    </option>

                    <option value="KG">
                        Quilograma
                    </option>

                    <option value="CX">
                        Caixa
                    </option>

                    <option value="LT">
                        Litro
                    </option>

                    <option value="PCT">
                        Pacote
                    </option>

                </select>

            </div>

            <div class="campo">

                <label>Quantidade em Estoque</label>

                <input type="number"
                       id="quantidadeEstoque"
                       placeholder="Quantidade">

            </div>

            <div class="botoes">

                <button class="btn-salvar"
                        onclick="salvarProduto()">

                    Salvar Produto

                </button>

                <button class="btn-cancelar"
                        onclick="limparFormulario()">

                    Cancelar

                </button>

            </div>

        </section>


        <section class="lista">

            <h2>Produtos Cadastrados</h2>

            <table>

                <thead>

                    <tr>

                        <th>ID</th>
                        <th>Produto</th>
                        <th>Valor</th>
                        <th>Unidade</th>
                        <th>Estoque</th>
                        <th>Ações</th>

                    </tr>

                </thead>

                <tbody id="tabelaProdutos">
                </tbody>

            </table>

        </section>

    </main>

    <script src="js/script.js"></script>

</body>

</html>
